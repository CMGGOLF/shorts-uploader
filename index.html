<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Shorts Uploader</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #fff;
        }
        
        .auth-status {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .auth-status.ready { border-left: 4px solid #4caf50; }
        .auth-status.not-ready { border-left: 4px solid #ff9800; }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .btn-primary { background: #4caf50; color: white; }
        .btn-primary:hover { background: #45a049; }
        .btn-primary:disabled { background: #666; cursor: not-allowed; }
        
        .btn-secondary { background: #333; color: #e0e0e0; border: 1px solid #555; }
        .btn-secondary:hover { background: #444; }
        
        .btn-danger { background: #f44336; color: white; }
        
        .section {
            background: #222;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .section h2 {
            font-size: 16px;
            margin-bottom: 16px;
            color: #aaa;
            font-weight: 500;
        }
        
        .upload-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: 1 / -1; }
        
        label { font-size: 13px; color: #aaa; }
        
        input, textarea, select {
            background: #333;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 10px 12px;
            color: #fff;
            font-size: 14px;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #4caf50;
        }
        
        textarea { min-height: 80px; resize: vertical; }
        
        .file-input {
            background: #333;
            border: 2px dashed #555;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .file-input:hover { border-color: #4caf50; }
        .file-input.has-file { border-color: #4caf50; background: #2a3a2a; }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        
        th { color: #888; font-weight: 500; font-size: 13px; }
        
        tr:hover { background: #2a2a2a; }
        
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status-ready { background: #333; color: #aaa; }
        .status-uploading { background: #1565c0; color: white; }
        .status-done { background: #2e7d32; color: white; }
        .status-error { background: #c62828; color: white; }
        
        .progress-bar {
            width: 100px;
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
        }
        
        .progress-bar-fill {
            height: 100%;
            background: #4caf50;
            transition: width 0.3s;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        a { color: #4caf50; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>YouTube Shorts Uploader</h1>
        
        <div id="authStatus" class="auth-status not-ready">
            <span id="authText">인증 상태 확인 중...</span>
            <button class="btn btn-primary" id="authBtn" onclick="doAuth()">Google 로그인</button>
        </div>
        
        <div class="section">
            <h2>새 영상 추가</h2>
            <form id="uploadForm" class="upload-form">
                <div class="form-group full">
                    <div class="file-input" id="fileDrop" onclick="document.getElementById('videoFile').click()">
                        <input type="file" id="videoFile" accept="video/mp4,video/quicktime" style="display:none" onchange="onFileSelect(this)">
                        <div id="fileText">클릭하거나 영상을 드래그하세요 (MP4)</div>
                    </div>
                </div>
                <div class="form-group">
                    <label>제목</label>
                    <input type="text" id="title" placeholder="영상 제목 #Shorts">
                </div>
                <div class="form-group">
                    <label>태그 (쉼표로 구분)</label>
                    <input type="text" id="tags" placeholder="shorts, 키워드1, 키워드2">
                </div>
                <div class="form-group full">
                    <label>설명</label>
                    <textarea id="description" placeholder="영상 설명&#10;&#10;#Shorts #키워드"></textarea>
                </div>
                <div class="form-group">
                    <label>공개 설정</label>
                    <select id="privacy">
                        <option value="public">공개</option>
                        <option value="unlisted">일부 공개</option>
                        <option value="private">비공개</option>
                    </select>
                </div>
                <div class="form-group" style="justify-content: flex-end;">
                    <button type="submit" class="btn btn-primary" style="margin-top: auto;">목록에 추가</button>
                </div>
            </form>
        </div>
        
        <div class="section">
            <h2>업로드 목록</h2>
            <table>
                <thead>
                    <tr>
                        <th>파일명</th>
                        <th>제목</th>
                        <th>상태</th>
                        <th>진행률</th>
                        <th>작업</th>
                    </tr>
                </thead>
                <tbody id="videoList">
                    <tr><td colspan="5" class="empty-state">영상이 없습니다</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        let selectedFile = null;
        let pollingIntervals = {};
        
        // 초기화
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadVideos();
            
            document.getElementById('uploadForm').onsubmit = async (e) => {
                e.preventDefault();
                await addVideo();
            };
        });
        
        async function checkAuth() {
            const res = await fetch('/api/auth/status');
            const data = await res.json();
            
            const statusEl = document.getElementById('authStatus');
            const textEl = document.getElementById('authText');
            const btnEl = document.getElementById('authBtn');
            
            if (data.ready) {
                statusEl.className = 'auth-status ready';
                textEl.textContent = '인증 완료 - 업로드 가능';
                btnEl.style.display = 'none';
            } else if (data.has_client_secret) {
                statusEl.className = 'auth-status not-ready';
                textEl.textContent = 'Google 로그인이 필요합니다';
                btnEl.style.display = 'inline-block';
            } else {
                statusEl.className = 'auth-status not-ready';
                textEl.textContent = 'client_secret.json 파일이 필요합니다';
                btnEl.style.display = 'none';
            }
        }
        
        async function doAuth() {
            const btn = document.getElementById('authBtn');
            btn.disabled = true;
            btn.textContent = '로그인 중...';
            
            const res = await fetch('/api/auth/login', { method: 'POST' });
            const data = await res.json();
            
            if (data.success) {
                checkAuth();
            } else {
                alert(data.message);
                btn.disabled = false;
                btn.textContent = 'Google 로그인';
            }
        }
        
        function onFileSelect(input) {
            if (input.files.length > 0) {
                selectedFile = input.files[0];
                document.getElementById('fileText').textContent = selectedFile.name;
                document.getElementById('fileDrop').classList.add('has-file');
                
                // 제목이 비어있으면 파일명으로 채우기
                if (!document.getElementById('title').value) {
                    document.getElementById('title').value = selectedFile.name.replace(/\.[^/.]+$/, '') + ' #Shorts';
                }
            }
        }
        
        async function addVideo() {
            if (!selectedFile) {
                alert('영상을 선택해주세요');
                return;
            }
            
            const formData = new FormData();
            formData.append('video', selectedFile);
            formData.append('title', document.getElementById('title').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('tags', document.getElementById('tags').value);
            formData.append('privacy', document.getElementById('privacy').value);
            
            const res = await fetch('/api/videos', { method: 'POST', body: formData });
            if (res.ok) {
                // 폼 초기화
                selectedFile = null;
                document.getElementById('videoFile').value = '';
                document.getElementById('fileText').textContent = '클릭하거나 영상을 드래그하세요 (MP4)';
                document.getElementById('fileDrop').classList.remove('has-file');
                document.getElementById('uploadForm').reset();
                
                loadVideos();
            } else {
                const err = await res.json();
                alert(err.error || '추가 실패');
            }
        }
        
        async function loadVideos() {
            const res = await fetch('/api/videos');
            const videos = await res.json();
            
            const tbody = document.getElementById('videoList');
            
            if (videos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-state">영상이 없습니다</td></tr>';
                return;
            }
            
            tbody.innerHTML = videos.map(v => `
                <tr id="row-${v.id}">
                    <td>${v.filename}</td>
                    <td>${v.title}</td>
                    <td><span class="status-badge status-${v.status}" id="status-${v.id}">${getStatusText(v.status)}</span></td>
                    <td id="progress-${v.id}">-</td>
                    <td id="action-${v.id}">${getActionButton(v)}</td>
                </tr>
            `).join('');
        }
        
        function getStatusText(status) {
            const texts = { ready: '대기', uploading: '업로드 중', done: '완료', error: '오류' };
            return texts[status] || status;
        }
        
        function getActionButton(v) {
            if (v.status === 'done' && v.url) {
                return `<a href="${v.url}" target="_blank">영상 보기</a>`;
            } else if (v.status === 'ready') {
                return `<button class="btn btn-primary" onclick="startUpload('${v.id}')">업로드</button>`;
            }
            return '-';
        }
        
        async function startUpload(videoId) {
            const res = await fetch(`/api/upload/${videoId}`, { method: 'POST' });
            if (res.ok) {
                // 상태 폴링 시작
                pollingIntervals[videoId] = setInterval(() => pollStatus(videoId), 1000);
            }
        }
        
        async function pollStatus(videoId) {
            const res = await fetch(`/api/status/${videoId}`);
            const data = await res.json();
            
            const statusEl = document.getElementById(`status-${videoId}`);
            const progressEl = document.getElementById(`progress-${videoId}`);
            const actionEl = document.getElementById(`action-${videoId}`);
            
            if (statusEl) {
                statusEl.className = `status-badge status-${data.status}`;
                statusEl.textContent = getStatusText(data.status);
            }
            
            if (progressEl && data.progress !== undefined) {
                progressEl.innerHTML = `
                    <div class="progress-bar">
                        <div class="progress-bar-fill" style="width: ${data.progress}%"></div>
                    </div>
                    <span style="font-size:12px;color:#888">${data.progress}%</span>
                `;
            }
            
            if (data.status === 'done' || data.status === 'error') {
                clearInterval(pollingIntervals[videoId]);
                if (data.status === 'done' && actionEl) {
                    actionEl.innerHTML = `<a href="${data.url}" target="_blank">영상 보기</a>`;
                }
                if (data.status === 'error') {
                    alert('업로드 오류: ' + data.message);
                }
            }
        }
    </script>
</body>
</html>
