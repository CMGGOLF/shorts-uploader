<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube & Instagram Uploader</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { font-size: 24px; margin-bottom: 20px; }
        .auth-status {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .auth-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .auth-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4444;
        }
        .auth-dot.connected { background: #44ff44; }
        .card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card h2 { font-size: 16px; margin-bottom: 15px; color: #aaa; }
        .upload-area {
            border: 2px dashed #333;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .upload-area:hover { border-color: #555; }
        .upload-area.dragover { border-color: #4CAF50; }
        input[type="file"] { display: none; }
        .form-row {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        .form-group { flex: 1; }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }
        input[type="text"], textarea, select {
            width: 100%;
            background: #2a2a2a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
            color: #fff;
            font-size: 14px;
        }
        textarea { min-height: 80px; resize: vertical; }
        .platforms {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        .platform-check {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #2a2a2a;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
        }
        .platform-check input { width: 18px; height: 18px; }
        .btn {
            background: #4CAF50;
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 15px;
        }
        .btn:hover { background: #45a049; }
        .btn:disabled { background: #333; cursor: not-allowed; }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #333;
        }
        th { color: #888; font-weight: normal; font-size: 12px; }
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .status-uploading { background: #ff9800; }
        .status-completed { background: #4CAF50; }
        .status-error { background: #f44336; }
        .progress-bar {
            width: 100px;
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #4CAF50;
            transition: width 0.3s;
        }
        .empty-message {
            text-align: center;
            color: #666;
            padding: 30px;
        }
        a { color: #4CAF50; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>YouTube & Instagram Uploader</h1>
        
        <div class="auth-status">
            <div class="auth-item">
                <div class="auth-dot" id="youtube-dot"></div>
                <span>YouTube</span>
            </div>
            <div class="auth-item">
                <div class="auth-dot" id="instagram-dot"></div>
                <span>Instagram</span>
            </div>
        </div>
        
        <div class="card">
            <h2>새 영상 추가</h2>
            <div class="upload-area" id="upload-area">
                <p>클릭하거나 영상을 드래그하세요 (MP4)</p>
                <input type="file" id="file-input" accept="video/mp4">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>제목</label>
                    <input type="text" id="title" placeholder="영상 제목 #Shorts">
                </div>
                <div class="form-group">
                    <label>태그 (쉼표로 구분)</label>
                    <input type="text" id="tags" placeholder="shorts, 키워드1, 키워드2">
                </div>
            </div>
            
            <div class="form-group" style="margin-top: 15px;">
                <label>설명</label>
                <textarea id="description" placeholder="영상 설명"></textarea>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>공개 설정 (YouTube)</label>
                    <select id="privacy">
                        <option value="public">공개</option>
                        <option value="unlisted">일부공개</option>
                        <option value="private">비공개</option>
                    </select>
                </div>
            </div>
            
            <div class="platforms">
                <label class="platform-check">
                    <input type="checkbox" id="platform-youtube" checked>
                    <span>YouTube</span>
                </label>
                <label class="platform-check">
                    <input type="checkbox" id="platform-instagram">
                    <span>Instagram</span>
                </label>
            </div>
            
            <button class="btn" id="upload-btn" disabled>업로드 시작</button>
        </div>
        
        <div class="card">
            <h2>업로드 목록</h2>
            <table>
                <thead>
                    <tr>
                        <th>파일명</th>
                        <th>제목</th>
                        <th>YouTube</th>
                        <th>Instagram</th>
                    </tr>
                </thead>
                <tbody id="video-list">
                    <tr>
                        <td colspan="4" class="empty-message">영상이 없습니다</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('upload-btn');
        let selectedFile = null;
        
        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFileSelect();
            }
        });
        fileInput.addEventListener('change', handleFileSelect);
        
        function handleFileSelect() {
            if (fileInput.files.length) {
                selectedFile = fileInput.files[0];
                uploadArea.innerHTML = `<p>${selectedFile.name}</p>`;
                uploadBtn.disabled = false;
            }
        }
        
        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            const formData = new FormData();
            formData.append('video', selectedFile);
            formData.append('title', document.getElementById('title').value || selectedFile.name);
            formData.append('description', document.getElementById('description').value);
            formData.append('tags', document.getElementById('tags').value);
            formData.append('privacy', document.getElementById('privacy').value);
            
            if (document.getElementById('platform-youtube').checked) {
                formData.append('platforms', 'youtube');
            }
            if (document.getElementById('platform-instagram').checked) {
                formData.append('platforms', 'instagram');
            }
            
            uploadBtn.disabled = true;
            uploadBtn.textContent = '업로드 중...';
            
            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (result.video_id) {
                    resetForm();
                    loadVideos();
                }
            } catch (e) {
                alert('업로드 실패: ' + e.message);
            }
            
            uploadBtn.disabled = false;
            uploadBtn.textContent = '업로드 시작';
        });
        
        function resetForm() {
            selectedFile = null;
            fileInput.value = '';
            uploadArea.innerHTML = '<p>클릭하거나 영상을 드래그하세요 (MP4)</p>';
            document.getElementById('title').value = '';
            document.getElementById('description').value = '';
            document.getElementById('tags').value = '';
        }
        
        async function loadVideos() {
            try {
                const response = await fetch('/api/videos');
                const videos = await response.json();
                const tbody = document.getElementById('video-list');
                
                if (Object.keys(videos).length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="empty-message">영상이 없습니다</td></tr>';
                    return;
                }
                
                tbody.innerHTML = Object.entries(videos).map(([id, video]) => `
                    <tr>
                        <td>${video.filename}</td>
                        <td>${video.title}</td>
                        <td>${renderStatus(video.youtube)}</td>
                        <td>${renderStatus(video.instagram)}</td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error(e);
            }
        }
        
        function renderStatus(status) {
            if (!status) return '-';
            if (status.status === 'uploading') {
                return `<div class="progress-bar"><div class="progress-fill" style="width: ${status.progress || 0}%"></div></div>`;
            }
            if (status.status === 'completed') {
                return `<a href="${status.url}" target="_blank">완료</a>`;
            }
            if (status.status === 'error') {
                return `<span class="status-badge status-error" title="${status.message}">오류</span>`;
            }
            return status.status;
        }
        
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth/status');
                const status = await response.json();
                document.getElementById('youtube-dot').classList.toggle('connected', status.youtube);
                document.getElementById('instagram-dot').classList.toggle('connected', status.instagram);
            } catch (e) {
                console.error(e);
            }
        }
        
        checkAuth();
        loadVideos();
        setInterval(loadVideos, 3000);
    </script>
</body>
</html>
